<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16141f" media="(prefers-color-scheme: dark)" />
    <title>School Community</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Apply the saved theme and language before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        if (localStorage.getItem("language") === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Outfit:wght@500..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
